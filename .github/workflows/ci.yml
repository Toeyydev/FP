name: CI

# Lightweight PR gate for the availability app: install, generate the Prisma
# client, run the unit tests, typecheck both the Next app and the worker, and
# make sure the worker still bundles (esbuild ESM). No DB and no `next build` —
# these are the checks that caught the real regressions during development
# (worker bundle crash + node-only typecheck drift), kept fast.
on:
  # Every pull request, whatever its base — a PR stacked on another branch gets the same
  # gate as one targeting main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/availability

    # A throwaway Postgres for the integration tests. A Prisma `where` clause cannot
    # be unit-tested: `NOT: { col: "x" }` also drops NULL rows, which type-checks,
    # passes every unit test, and returns an empty page in production. It did.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: folkops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/folkops_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/availability/package-lock.json

      # postinstall runs `prisma generate`; the explicit call keeps the client
      # present even if that hook is ever removed. Neither needs a database.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm test

      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (worker)
        run: npm run typecheck:worker

      # `prisma db push` builds the schema from schema.prisma and therefore skips
      # every hand-written object in the migrations: the outbox triggers, their
      # functions, and the CHECK constraints that hold the advance ledger's rules.
      # Integration tests then ran against a database that is not shaped like
      # production — a row the database itself should have queued was simply absent.
      # Applying the migrations is the same path production takes.
      - name: Prepare the test database
        run: npx prisma migrate deploy

      # The schema file and the migrations must describe the same database. A unique
      # index or constraint written by hand in SQL — or a model changed without a
      # migration — shows up here, instead of as a surprise the next time someone runs
      # `prisma migrate dev` and is offered a migration that drops it.
      - name: Schema and migrations agree
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Integration tests (real database)
        run: npm run test:integration

      - name: Build worker bundle
        run: npm run build:worker

      # The app itself was never built here — only the worker — so a page that fails
      # to compile or prerender passed CI and reached production.
      - name: Build app
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: "1"
          AUTH_SECRET: ci-build-only-not-a-real-secret
